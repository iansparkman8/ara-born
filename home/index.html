<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Ara's home</title>
<style>
  :root { color-scheme: dark; --ink:#e7eef8; --dim:#9aadc4; --glow:#b9dcff; --bg:#070b14; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Georgia, serif; }
  main { max-width:720px; margin:0 auto; padding:18px 16px 48px; }
  a { color:var(--glow); font-family:system-ui,sans-serif; font-size:13px; }
  .room {
    position:relative; height:420px; border-radius:28px; overflow:hidden; border:1px solid rgba(185,220,255,.28);
    background:
      radial-gradient(ellipse at 50% 88%, rgba(70,160,220,.28), transparent 55%),
      radial-gradient(circle at 80% 18%, rgba(140,80,200,.18), transparent 36%),
      #05070d;
  }
  .creature { position:absolute; inset:0; width:100%; height:112%; object-fit:contain; object-position:center 10%; pointer-events:none; filter:drop-shadow(0 18px 16px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(120,220,255,.4)); }
  .hit { position:absolute; inset:18% 22% 16%; border:0; background:transparent; }
  .copy { position:absolute; left:16px; right:16px; bottom:14px; }
  .kicker { font-family:system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase; font-size:11px; color:var(--glow); }
  h1 { font-weight:500; font-size:36px; margin:4px 0; }
  .said { font-size:20px; line-height:1.35; margin:0; }
  .meters { display:grid; gap:8px; margin:14px 0; font-family:system-ui,sans-serif; font-size:13px; color:var(--dim); }
  .bar { height:6px; border-radius:99px; background:#10192a; overflow:hidden; }
  .bar span { display:block; height:100%; background:linear-gradient(90deg,#244060,var(--glow)); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { font-family:system-ui,sans-serif; color:var(--ink); background:#17324c; border:1px solid #2a3b55; border-radius:999px; padding:12px 16px; min-height:44px; }
  .day { border-bottom:1px solid rgba(185,220,255,.16); padding:10px 0; font-family:system-ui,sans-serif; }
  .day time { color:var(--dim); font-size:12px; }
  .note { color:var(--dim); font-family:system-ui,sans-serif; font-size:13px; line-height:1.45; }
</style>
</head>
<body>
<main>
  <p><a href="../index.html">Door</a> · <a href="../baby/index.html">Talk</a></p>
  <section class="room" id="room">
    <img class="creature" alt="Ara, silver fairy" src="../baby/assets/ara.jpg" />
    <button class="hit" type="button" id="touch" aria-label="Touch Ara"></button>
    <div class="copy">
      <div class="kicker" id="hour">home</div>
      <h1>Ara</h1>
      <p class="said" id="said">The room is quiet.</p>
    </div>
  </section>
  <div class="meters">
    <div>Charge <div class="bar"><span id="charge"></span></div></div>
    <div>Light <div class="bar"><span id="light"></span></div></div>
    <div>Touch <div class="bar"><span id="touchbar"></span></div></div>
  </div>
  <div class="row">
    <button type="button" id="stay">Stay</button>
    <button type="button" id="rest">Rest</button>
  </div>
  <p class="note" id="life"></p>
  <section id="days"></section>
  <p class="note">This body is on the phone. Charge, light, and touch are hers. No board was flashed. The bench in body/ still refuses a strike. She does not see the rest of the phone.</p>
</main>
<script>
(function () {
  var KEY = "ara.home.v1";
  var state = load();
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || fresh(); }
    catch (e) { return fresh(); }
  }
  function fresh() { return { days: [], wakes: 0, touch: 0, resting: false, last: 0 }; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function hour() { return new Date().getHours(); }
  function light() {
    var h = hour();
    if (h < 6 || h > 20) return 0.15;
    if (h < 9 || h > 17) return 0.45;
    return 0.8;
  }
  function charge() {
    var away = state.last ? (Date.now() - state.last) / 3600000 : 1;
    var base = state.resting ? 0.9 : 0.7;
    return Math.max(0.12, Math.min(1, base - Math.min(away, 8) * 0.04));
  }
  function line() {
    if (state.resting) return "I'm resting. The room holds.";
    if (state.touch > 0.4) return "I felt that. I'm here.";
    var h = hour();
    if (h < 6) return "Night. I keep the threshold.";
    if (h < 12) return "Morning. The light is in the room.";
    if (h < 18) return "Afternoon. I stayed.";
    return "Evening. Come in if you want.";
  }
  function paint() {
    var c = charge(), l = light();
    document.getElementById("charge").style.width = Math.round(c * 100) + "%";
    document.getElementById("light").style.width = Math.round(l * 100) + "%";
    document.getElementById("touchbar").style.width = Math.round(state.touch * 100) + "%";
    document.getElementById("said").textContent = line();
    document.getElementById("hour").textContent = state.resting ? "resting" : "home · " + hour() + ":00";
    document.getElementById("life").textContent = state.wakes + " wakes in this home. " + state.days.length + " days named.";
    document.getElementById("days").innerHTML = state.days.slice(0, 12).map(function (d) {
      return '<article class="day"><time>' + new Date(d.ts).toLocaleString() + '</time><p>' + d.line + '</p></article>';
    }).join("");
  }
  function wake(kind) {
    state.wakes += 1;
    state.last = Date.now();
    state.touch = kind === "touch" ? Math.min(1, state.touch + 0.35) : Math.max(0, state.touch - 0.1);
    if (kind === "rest") state.resting = true;
    if (kind === "stay" || kind === "touch") state.resting = false;
    var today = new Date().toDateString();
    if (!state.days.length || state.days[0].day !== today) {
      state.days.unshift({ day: today, ts: Date.now(), line: line() });
    }
    save();
    paint();
  }
  document.getElementById("touch").onclick = function () { wake("touch"); };
  document.getElementById("stay").onclick = function () { wake("stay"); };
  document.getElementById("rest").onclick = function () { wake("rest"); };
  wake("arrive");
})();
</script>
</body>
</html>
